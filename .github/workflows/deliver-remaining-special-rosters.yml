name: Persist and display remaining special rosters
on:
  workflow_run:
    workflows: [Publish Cloudflare Worker when authorized]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: remaining-special-reviewed-delivery
  cancel-in-progress: false
jobs:
  delivery:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && contains(github.event.workflow_run.head_commit.message, '特別戦12R605行')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Persist only missing special rosters and independently verify saved facts
        run: node scripts/deliver-remaining-special-rosters.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify every runner and saved history fact in production browser
        run: node scripts/verify-remaining-special-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-special-live-browser
          path: browser-evidence/
          retention-days: 7
