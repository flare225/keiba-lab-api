name: Historical result audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: historical-result-audit
  cancel-in-progress: true

env:
  PRODUCTION_URL: https://keiba-lab-api.sekai-no-bancyou.workers.dev
  AUDIT_DATE: '2026-10-04'

jobs:
  result-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Audit stored result coverage without triggering collection
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -fsS --max-time 30 "$PRODUCTION_URL/v1/lab/history-result-status?date=$AUDIT_DATE")"
          printf '%s\n' "$status" | jq '{ok,version,date,races,completeRaces,richCompleteRaces,incompleteRichRaces,runnerRows,last3fMissing,cornersMissing,learningReady}'
          printf '%s' "$status" | jq -e '
            .ok == true and .races > 0 and
            .completeRaces == .races and .incompleteRaces == 0 and
            .runnerRows.expected > 0 and .runnerRows.stored == .runnerRows.expected and
            .richCompleteRaces == ([.details[] | select(.richComplete == true)] | length) and
            .incompleteRichRaces == (.races - .richCompleteRaces) and
            .learningReady == (.races > 0 and .richCompleteRaces == .races) and
            .last3fMissing >= 0 and .cornersMissing >= 0
          ' > /dev/null
          {
            echo '## KEIBA LABO stored-result audit'
            echo "- Date: $AUDIT_DATE"
            echo "- All-runner result rows: $(printf '%s' "$status" | jq -r '.runnerRows.stored')/$(printf '%s' "$status" | jq -r '.runnerRows.expected')"
            echo "- Rich-complete races: $(printf '%s' "$status" | jq -r '.richCompleteRaces')/$(printf '%s' "$status" | jq -r '.races')"
            echo "- Pending detail collection: $(printf '%s' "$status" | jq -r '.incompleteRichRaces') races"
            echo '- Audit reads stored data only; no backfill is triggered.'
            echo '- Result coverage does not mean model training or validated accuracy improvement.'
          } >> "$GITHUB_STEP_SUMMARY"
