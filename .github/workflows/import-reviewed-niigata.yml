name: Persist and display reviewed Niigata data
on:
  workflow_run:
    workflows: [Publish Cloudflare Worker when authorized]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: reviewed-niigata-delivery
  cancel-in-progress: false
jobs:
  delivery:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && contains(github.event.workflow_run.head_commit.message, '新潟22頭')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Persist roster and source-separated history with independent readback
        run: node scripts/import-reviewed-niigata.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify Niigata all runners visible in live app
        env:
          ROSTER_TARGETS: '[{"date":"2026-10-25","venue":"新潟","raceNo":11,"count":22},{"date":"2026-10-25","venue":"新潟","raceNo":9,"count":23},{"date":"2026-10-25","venue":"新潟","raceNo":10,"count":14}]'
        run: node scripts/verify-live-expected-rosters.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: niigata-live-browser
          path: browser-evidence/
          retention-days: 7
      - name: Resume bounded missing JRA history subject to current gate
        run: node scripts/deliver-upcoming-history.mjs
