name: Mainichi hydration diagnostic
on:
  push:
    branches: [diag/mainichi-hydration]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Print Mainichi replay hydration and readback
        run: |
          set -euo pipefail
          base='https://keiba-lab-api.sekai-no-bancyou.workers.dev'
          args=(--data-urlencode 'date=2026-10-04' --data-urlencode 'venue=東京' --data-urlencode 'race_no=11')
          echo '=== REPLAY ==='
          curl -fsS --get --max-time 60 "$base/v1/lab/replay" "${args[@]}" | jq '{version,race,evidence,replay,hydration,guardrails}'
          echo '=== HISTORY STATUS ==='
          curl -fsS --get --max-time 30 "$base/v1/lab/history-status" "${args[@]}" | jq '{version,raceKey,runnerCount,horsesCovered,coveragePct,totalHistoryRows,runners}'
          echo '=== PRIOR ROW CELL SHAPE (first runner, pre-target rows only) ==='
          ingest="$(curl -fsS --get --max-time 60 "$base/v1/lab/history-ingest" "${args[@]}" --data-urlencode 'limit=10')"
          profile="$(printf '%s' "$ingest" | jq -r '.results[0].profileUrl // empty')"
          test -n "$profile"
          curl -fsS --max-time 30 "$profile" | iconv -f SHIFT_JIS -t UTF-8//IGNORE > /tmp/profile.html
          node - <<'NODE'
          const fs=require('fs');let h=fs.readFileSync('/tmp/profile.html','utf8');
          const text=s=>s.replace(/<[^>]+>/g,' ').replace(/&nbsp;|&#160;/gi,' ').replace(/&amp;/gi,'&').replace(/\s+/g,' ').trim();
          let n=0;for(const m of h.matchAll(/<tr\b[^>]*>([\s\S]*?)<\/tr>/gi)){const cells=[...m[1].matchAll(/<(?:td|th)\b[^>]*>([\s\S]*?)<\/(?:td|th)>/gi)].map(x=>text(x[1]));const dm=String(cells[0]||'').match(/(\d{4})年\s*(\d{1,2})月\s*(\d{1,2})日/);if(!dm)continue;const d=dm[1]+'-'+String(dm[2]).padStart(2,'0')+'-'+String(dm[3]).padStart(2,'0');if(d>='2026-10-04')continue;console.log(JSON.stringify({date:d,cells}));if(++n>=3)break;}
          NODE
          echo '=== RANK READBACK ==='
          curl -fsS --get --max-time 30 "$base/v1/lab/rank" "${args[@]}" | jq '{version,race,leakageGuard,runners:[.runners[]|{horseNo,horseName,historyRows,evidenceScore,evidenceRank,missingBlocks}]}'
