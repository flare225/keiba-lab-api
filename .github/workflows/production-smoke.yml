name: Production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

env:
  PRODUCTION_URL: https://keiba-lab-api.sekai-no-bancyou.workers.dev

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Resolve expected Worker version
        id: expected
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('wrangler.jsonc', 'utf8');
          const m = text.match(/"main"\s*:\s*"src\/index-v([^"/]+)\.js"/);
          if (!m) process.exit(2);
          process.stdout.write(m[1]);
          NODE
          )"
          test -n "$expected"
          echo "version=$expected" >> "$GITHUB_OUTPUT"
          echo "Expected production version: $expected"

      - name: Verify deployed version
        id: deploy
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.expected.outputs.version }}
        run: |
          set -euo pipefail
          last=''
          for attempt in $(seq 1 18); do
            body="$(curl -fsS --max-time 10 "$PRODUCTION_URL/v1/lab/deploy-check" 2>/dev/null || true)"
            last="$body"
            actual="$(printf '%s' "$body" | jq -r '.version // empty' 2>/dev/null || true)"
            ok="$(printf '%s' "$body" | jq -r '.ok // false' 2>/dev/null || true)"
            if [[ "$ok" == "true" && "$actual" == "$EXPECTED_VERSION" ]]; then
              echo "Production is serving v$actual"
              printf '%s\n' "$body" | jq .
              exit 0
            fi
            sleep 5
          done
          echo "Production did not converge to expected version $EXPECTED_VERSION" >&2
          echo "Last deploy-check response:" >&2
          printf '%s\n' "$last" >&2
          exit 1

      - name: Backfill and verify 2026-10-04 all-race cards
        id: history
        shell: bash
        run: |
          set -euo pipefail
          date='2026-10-04'
          audit_url="$PRODUCTION_URL/v1/lab/storage-audit?from=$date&to=$date"
          audit="$(curl -fsS --max-time 20 "$audit_url")"
          program_count="$(printf '%s' "$audit" | jq -r '.totals.programRaces // 0')"
          complete="$(printf '%s' "$audit" | jq -r '.allCardsComplete // false')"
          test "$program_count" -gt 0

          if [[ "$complete" != 'true' ]]; then
            echo "Historical coverage incomplete; backfilling $program_count programs for $date"
            for ((cursor=0; cursor<program_count; cursor+=8)); do
              success=false
              for attempt in 1 2 3; do
                body="$(curl -fsS --max-time 90 "$PRODUCTION_URL/v1/lab/card-ingest?date=$date&cursor=$cursor&limit=8" || true)"
                echo "Batch cursor=$cursor attempt=$attempt"
                printf '%s\n' "$body" | jq '{ok,date,programRaceCount,attempted,storedRaceCards,storedRunners,cursor,nextCursor,runs}' || true
                batch_ok="$(printf '%s' "$body" | jq -r '.ok // false' 2>/dev/null || true)"
                if [[ "$batch_ok" == 'true' ]]; then
                  success=true
                  break
                fi
                sleep $((attempt * 5))
              done
              if [[ "$success" != 'true' ]]; then
                echo "Backfill batch cursor=$cursor did not fully succeed after retries; final audit will determine coverage." >&2
              fi
            done
          else
            echo "$date is already fully covered; no backfill needed."
          fi

          final="$(curl -fsS --max-time 20 "$audit_url")"
          printf '%s\n' "$final" | jq '{ok,from,to,totals,dates,allCardsComplete,missingCards,anomalies}'
          all_complete="$(printf '%s' "$final" | jq -r '.allCardsComplete // false')"
          cards="$(printf '%s' "$final" | jq -r '.totals.raceCardsStored // 0')"
          programs="$(printf '%s' "$final" | jq -r '.totals.programRaces // 0')"
          runners="$(printf '%s' "$final" | jq -r '.totals.runnersStored // 0')"
          declared="$(printf '%s' "$final" | jq -r '.totals.declaredRunners // 0')"
          anomalies="$(printf '%s' "$final" | jq -r '.anomalies | length')"
          test "$all_complete" = 'true'
          test "$cards" -eq "$programs"
          test "$runners" -eq "$declared"
          test "$anomalies" -eq 0
          echo "programs=$programs" >> "$GITHUB_OUTPUT"
          echo "cards=$cards" >> "$GITHUB_OUTPUT"
          echo "runners=$runners" >> "$GITHUB_OUTPUT"
          echo "declared=$declared" >> "$GITHUB_OUTPUT"

      - name: Backfill replay-safe horse history
        id: replay_history
        shell: bash
        run: |
          set -euo pipefail
          for venue in 東京 京都; do
            before="$(curl -fsS --get --max-time 30 "$PRODUCTION_URL/v1/lab/history-status" --data-urlencode 'date=2026-10-04' --data-urlencode "venue=$venue" --data-urlencode 'race_no=11')"
            coverage="$(printf '%s' "$before" | jq -r '.coveragePct // 0')"
            echo "$venue prior-history coverage before: $coverage%"
            if awk "BEGIN {exit !($coverage < 100)}"; then
              ingest="$(curl -fsS --get --max-time 150 "$PRODUCTION_URL/v1/lab/history-ingest" --data-urlencode 'date=2026-10-04' --data-urlencode "venue=$venue" --data-urlencode 'race_no=11' --data-urlencode 'limit=5')"
              printf '%s\n' "$ingest" | jq '{ok,stage,race,historyLimit,profileLinksFound,horsesWithHistory,savedRows,failed,leakageGuard,results:[.results[]|{horseName,status,rows,reason}]}'
            fi
            after="$(curl -fsS --get --max-time 30 "$PRODUCTION_URL/v1/lab/history-status" --data-urlencode 'date=2026-10-04' --data-urlencode "venue=$venue" --data-urlencode 'race_no=11')"
            printf '%s\n' "$after" | jq '{raceKey,runnerCount,horsesCovered,coveragePct,totalHistoryRows,runners}'
          done

      - name: Verify result-blind replay targets
        id: replay
        shell: bash
        run: |
          set -euo pipefail
          mainichi="$(curl -fsS --get --max-time 30 "$PRODUCTION_URL/v1/lab/replay" --data-urlencode 'date=2026-10-04' --data-urlencode 'venue=東京' --data-urlencode 'race_no=11')"
          kyoto="$(curl -fsS --get --max-time 30 "$PRODUCTION_URL/v1/lab/replay" --data-urlencode 'date=2026-10-04' --data-urlencode 'venue=京都' --data-urlencode 'race_no=11')"
          for item in mainichi kyoto; do
            body="${!item}"
            test "$(printf '%s' "$body" | jq -r '.ok // false')" = 'true'
            grade="$(printf '%s' "$body" | jq -r '.evidence.grade // "NO_RECORD"')"
            available="$(printf '%s' "$body" | jq -r '.replay.available // .prediction.available // false')"
            echo "$item grade=$grade available=$available"
            printf '%s\n' "$body" | jq '{race,evidence,replay:(.replay|{available,model,coverageCeilingPct,top5,meaning,reason,scoredRunners,runnerCount}),guardrails}'
            test "$grade" != 'NO_RECORD'
            if [[ "$grade" == 'RESULT_BLIND_REPLAY' ]]; then
              test "$(printf '%s' "$body" | jq -r '.guardrails.targetRaceOutcomeQueried')" = 'false'
              test "$(printf '%s' "$body" | jq -r '.guardrails.targetRaceResultFieldsUsed')" = 'false'
              test "$(printf '%s' "$body" | jq -r '.guardrails.accuracyCredit')" = 'false'
              test "$(printf '%s' "$body" | jq -r '.replay.top5 | length')" -eq 5
            fi
            echo "${item}_grade=$grade" >> "$GITHUB_OUTPUT"
          done

      - name: Diagnose upcoming JRA program staging
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --get --max-time 30 "$PRODUCTION_URL/v1/lab/program-debug" --data-urlencode 'date=2026-10-10')"
          printf '%s\n' "$body" | jq '{ok,version,stage,date,httpStatus,sourceUrl,encoding,decodeScore,venueHeadersFound,raceCount,gradedCount,venueSummary,error,debug}'
          staged="$(curl -fsS --max-time 15 "$PRODUCTION_URL/v1/lab/storage-audit?from=2026-10-10&to=2026-10-10")"
          printf '%s\n' "$staged" | jq '{ok,from,to,totals,dates}'

      - name: Read scheduler observability
        id: scheduler
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 15 "$PRODUCTION_URL/v1/lab/scheduler-status?limit=5")"
          ok="$(printf '%s' "$body" | jq -r '.ok // false')"
          test "$ok" = "true"
          heartbeat="$(printf '%s' "$body" | jq -r '.cronHeartbeat // "unknown"')"
          echo "heartbeat=$heartbeat" >> "$GITHUB_OUTPUT"
          echo "Cron heartbeat: $heartbeat"
          printf '%s\n' "$body" | jq '{ok,version,checkedAt,configuredCron,cronHeartbeat,latestScheduled}'

      - name: Verify Saudi RC pre-card schema and seed
        id: precard
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 15 "$PRODUCTION_URL/v1/lab/precard-context-status")"
          printf '%s\n' "$body" | jq '{ok,version,raceKey,target,dataQuality,officialCardComparison,warnings,guardrails}'
          ok="$(printf '%s' "$body" | jq -r '.ok // false')"
          race_key="$(printf '%s' "$body" | jq -r '.raceKey // empty')"
          race_date="$(printf '%s' "$body" | jq -r '.target.date // empty')"
          race_name="$(printf '%s' "$body" | jq -r '.target.raceName // empty')"
          status="$(printf '%s' "$body" | jq -r '.target.status // empty')"
          authoritative="$(printf '%s' "$body" | jq -r '.guardrails.authoritativeForCard')"
          seal_eligible="$(printf '%s' "$body" | jq -r '.guardrails.eligibleForProspectiveSeal')"
          official_required="$(printf '%s' "$body" | jq -r '.guardrails.officialNumberedCardStillRequired')"
          test "$ok" = "true"
          test "$race_key" = "2026-10-10:東京:11"
          test "$race_date" = "2026-10-10"
          test "$race_name" = "サウジアラビアロイヤルカップ"
          test "$authoritative" = "false"
          test "$seal_eligible" = "false"
          test "$official_required" = "true"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Saudi RC pre-card target is seeded; status: $status"

      - name: Verify independent user-mark audit layer
        id: marks
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.expected.outputs.version }}
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 15 "$PRODUCTION_URL/v1/lab/user-mark-capabilities")"
          printf '%s\n' "$body" | jq .
          ok="$(printf '%s' "$body" | jq -r '.ok')"
          version="$(printf '%s' "$body" | jq -r '.version')"
          independent="$(printf '%s' "$body" | jq -r '.principles.humanMarksAreIndependentInput')"
          mutation="$(printf '%s' "$body" | jq -r '.principles.scoreMutation')"
          official="$(printf '%s' "$body" | jq -r '.principles.officialCardRequiredForPostDrawAndFinal')"
          precard="$(printf '%s' "$body" | jq -r '.principles.initialCanUseIsolatedPrecardNames')"
          infer="$(printf '%s' "$body" | jq -r '.principles.horseNumbersNeverInferredBeforeOfficialCard')"
          frozen="$(printf '%s' "$body" | jq -r '.principles.auditSnapshotPersistedWithRevision')"
          test "$ok" = "true"
          test "$version" = "$EXPECTED_VERSION"
          test "$independent" = "true"
          test "$mutation" = "false"
          test "$official" = "true"
          test "$precard" = "true"
          test "$infer" = "true"
          test "$frozen" = "true"
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Write production summary
        shell: bash
        run: |
          {
            echo "## KEIBA LABO production smoke"
            echo "- Expected/deployed version: ${{ steps.expected.outputs.version }}"
            echo "- 2026-10-04 historical coverage: ${{ steps.history.outputs.cards }}/${{ steps.history.outputs.programs }} races"
            echo "- 2026-10-04 runner coverage: ${{ steps.history.outputs.runners }}/${{ steps.history.outputs.declared }} runners"
            echo "- Mainichi Okan evidence: ${{ steps.replay.outputs.mainichi_grade }}"
            echo "- Kyoto Daishoten evidence: ${{ steps.replay.outputs.kyoto_grade }}"
            echo "- Scheduler endpoint reachable: yes"
            echo "- Cron heartbeat: ${{ steps.scheduler.outputs.heartbeat }}"
            echo "- Saudi RC pre-card schema/seed: verified"
            echo "- Saudi RC pre-card status: ${{ steps.precard.outputs.status }}"
            echo "- Pre-card context remains non-authoritative and cannot satisfy prospective LOCK by itself."
            echo "- User-mark DB audit layer: verified, score mutation disabled"
          } >> "$GITHUB_STEP_SUMMARY"
