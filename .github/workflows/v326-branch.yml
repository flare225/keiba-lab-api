name: v3.26 branch tests
on:
  push:
    branches: [fix/history-finish-v326]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check src/index-v3.26.0.js
