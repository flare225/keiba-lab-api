name: v326 node checks
on:
  push:
    branches: [fix/history-finish-v326]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check src/index-v3.26.0.js
      - run: node --test tests/*.test.mjs
