name: Verify bounded live race flow
on:
  push:
    branches: [main]
    paths: [scripts/verify-bounded-live-flow.mjs, scripts/verify-bounded-live-browser.mjs, .github/workflows/verify-bounded-live-flow.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bounded-live-race-flow
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify D1 recovery then at most three explicit race targets
        run: node scripts/verify-bounded-live-flow.mjs
      - name: Install isolated browser
        run: npm install --no-save --package-lock=false playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Compare production HTML with the independent live DB readbacks, without more API reads
        run: node scripts/verify-bounded-live-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounded-live-race-evidence
          path: bounded-live-evidence/
          retention-days: 7
