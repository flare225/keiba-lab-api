name: Verify Elizabeth II Cup result candidate and independent SHA (2026-11-15)
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-elizabeth-20261115.yml]
  workflow_dispatch:
  schedule:
    - cron: '35 7,10,13 15 11 *'
    - cron: '35 0,3,6 16 11 *'
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Validate result-window guard, then read one production candidate and verify its SHA
        shell: bash
        env:
          WORKER_URL: https://keiba-lab-api.sekai-no-bancyou.workers.dev
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          const now=Date.now();
          const earliest=Date.parse('2026-11-15T07:15:00Z'); // 16:15 JST: official result + 35min
          const latest=Date.parse('2026-11-16T06:35:00Z');   // 24h after Sunday's 15:35 focus expiry
          if(process.env.EVENT==='push'||now<earliest||now>=latest){
            console.log(JSON.stringify({phase:'SKIP',reason:'push-only dry-run or outside safe race-result window',event:process.env.EVENT,now:new Date(now).toISOString(),workerGET:0}));
            process.exit(0);
          }
          const ghHeaders={'authorization':'Bearer '+process.env.GH_TOKEN,'accept':'application/vnd.github+json','x-github-api-version':'2022-11-28'};
          const previousUrl='https://api.github.com/repos/'+process.env.REPO+'/actions/workflows/verify-elizabeth-20261115.yml/runs?event=schedule&status=success&per_page=10';
          const previousResponse=await fetch(previousUrl,{headers:ghHeaders,signal:AbortSignal.timeout(12000)});
          if(!previousResponse.ok){console.error('Cannot check prior-success receipt; skip production reads',previousResponse.status);process.exit(1);}
          const previous=await previousResponse.json();
          const previouslyPassed=(previous.workflow_runs||[]).some(r=>r.created_at>='2026-11-15T07:15:00Z'&&r.id!==Number(process.env.RUN_ID));
          if(previouslyPassed){console.log('Already verified and accepted in earlier GitHub scheduled run; workerGET=0');process.exit(0);}
          const params=new URLSearchParams({date:'2026-11-15',venue:'京都',race_no:'11'});
          const endpoint=process.env.WORKER_URL+'/v1/lab/automatic-learning-candidate?'+params.toString();
          const resp=await fetch(endpoint,{headers:{accept:'application/json'},signal:AbortSignal.timeout(25000)});
          let data;
          try{data=await resp.json();}catch(e){console.error('Production non-JSON body',resp.status,String(e));process.exit(1);}
          const record=data?.record;
          const rows=record?.rows||[];
          const sha=record?createHash('sha256').update(JSON.stringify(record),'utf8').digest('hex'):null;
          const predictionSHA='9a2927a4fa61ef5c4b27e3f534eb9d148952701c96f2a7945c152e32fa4ec2e9';
          const source=record?.resultSourceUrl||'';
          let validSource=false;
          try {
            const u=new URL(source);
            const m=(u.searchParams.get('CNAME')||'').match(/^pw01sde(?:01|10)(\\d{2})(\\d{4})(\\d{2})(\\d{2})(\\d{2})(\\d{8})\\/[a-z0-9]+$/i);
            validSource=u.protocol==='https:'&&u.hostname==='www.jra.go.jp'&&u.pathname==='/JRADB/accessS.html'&&!!m&&m[1]==='08'&&m[5]==='11'&&m[6]==='20261115';
          } catch {}
          const finishers=rows.filter(x=>x.finishStatus==='finished');
          const validRows=rows.length===18&&finishers.some(x=>x.finishPosition===1)&&new Set(finishers.map(x=>x.finishPosition)).size===finishers.length&&
            new Set(rows.map(x=>x.horseNo)).size===18&&new Set(rows.map(x=>x.horseName)).size===18&&
            rows.every(x=>typeof x.horseName==='string'&&x.horseName.length>0&&(
              x.finishStatus==='finished'?Number.isInteger(x.finishPosition)&&x.finishPosition>0&&x.finishPosition<=18:
              ['scratched','excluded','did-not-finish','disqualified'].includes(x.finishStatus)&&x.finishPosition==null
            ));
          const success=resp.ok&&data?.ok===true&&data?.available===true&&data?.integrityVerified===true&&
            record?.raceKey==='2026-11-15:京都:11'&&record?.predictionSha256===predictionSHA&&
            validSource&&/^[a-f0-9]{64}$/.test(record?.resultSourceSha256||'')&&
            validRows&&sha===data.labelSha256;
          const status={race:'2026-11-15 京都11R エリザベス女王杯',http:resp.status,ok:data?.ok,
            available:data?.available,integrityVerified:data?.integrityVerified,
            error:data?.error||null,runnerCount:rows.length,expected:18,validSource,validRows,
            predictionShaMatches:record?.predictionSha256===predictionSHA,
            savedLabelSha:data?.labelSha256||null,independentSha:sha,
            shaMatch:sha!=null&&sha===data.labelSha256,resultSourceUrl:source,passed:success,
            ...(success?{runners:rows.map(r=>({horseNo:r.horseNo,horseName:r.horseName,finishPosition:r.finishPosition,finishStatus:r.finishStatus}))}:{})};
          console.log(JSON.stringify(status));
          if(!success){console.error('SUNDAY_OUTCOMES_NOT_YET_ACCEPTED');process.exit(1);}
          console.log('SUNDAY_OFFICIAL_RESULTS_18_OF_18_CANDIDATE_SAVED_INDEPENDENT_SHA_MATCH');
          const comment=[
            '【日曜の照合完了】2026-11-15 京都11R エリザベス女王杯',
            '本番Workerへの対象限定GET（GitHub Actions scheduled）で、学習候補available/integrityVerified=true、公式出典JRA、正式18頭の馬番・馬名・結果/finishStatusを確認。',
            '事前LOCK ID10/seal5 に結び付く予想SHA: '+predictionSHA,
            '候補label SHA / Node crypto独立再計算SHA完全一致: '+sha,
            'JRA公式結果: '+source,
            'GitHub Actions実行証拠: https://github.com/'+process.env.REPO+'/actions/runs/'+process.env.RUN_ID,
            'このworkflowは本番GETのみ。結果/候補INSERTは既存自然処理による保存実体の受入であり、今回再書込み・手動POST・強制取得・直接D1操作・モデル重み変更は0。',
            '結果18頭: '+rows.map(r=>r.horseNo+' '+r.horseName+' '+(r.finishPosition??r.finishStatus)).join(' / ')
          ].join('\n');
          const post=await fetch('https://api.github.com/repos/'+process.env.REPO+'/issues/178/comments',
            {method:'POST',headers:{...ghHeaders,'content-type':'application/json'},
             body:JSON.stringify({body:comment}),signal:AbortSignal.timeout(12000)});
          console.log('Issue178 completion comment status:',post.status);
          if(!post.ok)console.error('Issue note could not be saved; verification success remains documented in this run log');
          NODE
