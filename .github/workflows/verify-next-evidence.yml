name: Verify remaining withheld comparisons
on:
  push:
    branches: [main]
    paths: ['scripts/verify-next-evidence-evaluations.mjs']
permissions:
  contents: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, '未検証対象の評価照合')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node scripts/verify-next-evidence-evaluations.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-evaluation-evidence
          path: next-evaluation-evidence
