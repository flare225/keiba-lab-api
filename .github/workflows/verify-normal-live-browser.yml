name: Verify normal production browser
on:
  push:
    branches: [main]
    paths: ['scripts/verify-normal-live-browser.mjs', '.github/workflows/verify-normal-live-browser.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-normal-live-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normal-live-browser-evidence
          path: normal-live-browser-evidence
