name: Verify production precard race panels
on:
  push:
    branches: [main]
    paths: [scripts/verify-precard-browser.mjs]
  workflow_run:
    workflows: [Publish Cloudflare Worker when authorized]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: precard-browser-verification
  cancel-in-progress: false
jobs:
  delivery:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && contains(github.event.workflow_run.head_commit.message, 'precard race panels')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify every runner and saved history fact in production browser
        run: node scripts/verify-precard-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precard-live-browser
          path: browser-evidence/
          retention-days: 7
