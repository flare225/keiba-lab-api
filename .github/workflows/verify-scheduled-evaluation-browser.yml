name: Verify scheduled evaluation in normal browser
on:
  push:
    branches: [main]
    paths: ['scripts/verify-scheduled-evaluation-browser.mjs']
permissions:
  contents: read
jobs:
  verify:
    if: contains(github.event.head_commit.message, '自然保存版の画面読返しだけ')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: node scripts/verify-scheduled-evaluation-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduled-evaluation-browser-evidence
          path: scheduled-evaluation-browser-evidence
